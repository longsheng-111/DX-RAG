# Alembic config. NOTE: keep this file pure ASCII.
# On Windows, alembic reads ini files with the system locale codec (GBK here),
# non-ASCII comments cause UnicodeDecodeError on Python 3.9.
# Connection URL is NOT kept here; alembic/env.py sets it from app.core.config.settings.

[alembic]
script_location = alembic
prepend_sys_path = .
# placeholder; env.py overrides with settings.database_url
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
